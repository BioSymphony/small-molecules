<svg xmlns="http://www.w3.org/2000/svg" width="840" height="569" viewBox="0 0 840 569" role="img" aria-labelledby="title description">
  <title id="title">CPU redocking workflow for PDB 1IEP</title>
  <desc id="description">Meeko prepares receptor and ligand PDBQT files and a search box config for AutoDock Vina. Vina reports empirical docking scores and writes docked poses in PDBQT. Meeko exports those poses to SDF. PoseBusters takes the SDF plus the receptor PDB and crystal ligand SDF and writes a per-pose CSV report.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 2 L8 5 L2 8" fill="none" stroke="#47728c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="840" height="569" rx="22" fill="#f2f7fb"/>
  <rect x="1" y="1" width="838" height="567" rx="21" fill="none" stroke="#cbdce9" stroke-width="2"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="28" y="49" font-size="30" font-weight="700" fill="#102d49">CPU redocking</text>
    <text x="812" y="48" text-anchor="end" font-size="21" font-weight="600" fill="#3a607b">Public structure · PDB 1IEP</text>
    <path d="M28 68 H812" stroke="#cbdce9" stroke-width="2"/>

    <g fill="none" stroke="#47728c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
      <path d="M54 125 V143"/>
      <path d="M54 196 V242"/>
      <path d="M54 294 V340"/>
      <path d="M54 392 V438"/>
      <path d="M54 490 V511"/>
      <path d="M544 270 H588"/>
      <path d="M701 432 V466 H550"/>
    </g>

    <rect x="28" y="85" width="516" height="40" rx="10" fill="#fff" stroke="#b8cfde" stroke-width="1.5"/>
    <text x="45" y="112" font-size="21" fill="#284d66">Receptor PDB + 3D ligand SDF + box center and size</text>

    <g fill="#e0f1f6" stroke="#aacddc" stroke-width="1.5">
      <rect x="28" y="148" width="516" height="48" rx="10"/>
      <rect x="28" y="246" width="516" height="48" rx="10"/>
      <rect x="28" y="344" width="516" height="48" rx="10"/>
    </g>
    <rect x="28" y="442" width="516" height="48" rx="10" fill="#fbe9e1" stroke="#e7b9a4" stroke-width="1.5"/>

    <g font-size="25" font-weight="700" fill="#102d49">
      <text x="45" y="180">Meeko</text>
      <text x="45" y="278">AutoDock Vina</text>
      <text x="45" y="376">Meeko</text>
      <text x="45" y="474">PoseBusters</text>
    </g>
    <g text-anchor="end" font-size="21" fill="#284d66">
      <text x="527" y="179">Prepare receptor and ligand</text>
      <text x="527" y="277">Dock in the search box</text>
      <text x="527" y="375">Export docked poses</text>
      <text x="527" y="473">Check each pose</text>
    </g>

    <g font-size="21" font-weight="600" fill="#284d66">
      <text x="74" y="226">Receptor and ligand PDBQT + Vina box config</text>
      <text x="74" y="324">Docked poses · PDBQT</text>
      <text x="74" y="422">Docked poses · SDF</text>
    </g>

    <rect x="594" y="246" width="218" height="48" rx="10" fill="#fff" stroke="#b8cfde" stroke-width="1.5"/>
    <text x="610" y="278" font-size="21" font-weight="600" fill="#284d66">Docking scores</text>

    <rect x="594" y="332" width="218" height="100" rx="10" fill="#fff" stroke="#b8cfde" stroke-width="1.5"/>
    <text x="610" y="362" font-size="22" font-weight="700" fill="#102d49">Reference files</text>
    <g font-size="21" fill="#284d66">
      <text x="610" y="391">Receptor PDB</text>
      <text x="610" y="418">Crystal ligand SDF</text>
    </g>

    <rect x="28" y="516" width="516" height="35" rx="10" fill="#fff" stroke="#e7b9a4" stroke-width="1.5"/>
    <text x="45" y="540" font-size="21" font-weight="600" fill="#673f2f">Per-pose check report · CSV</text>
  </g>
</svg>
