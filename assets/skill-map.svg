<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Agent workflow for tool selection, calling, and chaining</title>
  <desc id="description">An agent defines a task, uses SKILL.md to route it, inspects the tool knowledge base, calls an upstream tool, and validates or chains the output. Tool fit, input and output formats, compute, score meaning, and artifact terms travel with each handoff.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fcff"/>
      <stop offset="1" stop-color="#edf6fa"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-15%" width="124%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173f5f" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#6a9ab0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="24" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="518" rx="23" fill="none" stroke="#d9e8f0" stroke-width="2"/>

  <text x="42" y="49" fill="#123b63" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Agent workflow</text>
  <text x="42" y="79" fill="#466576" font-family="Arial, Helvetica, sans-serif" font-size="17">The repository supplies routing and tool knowledge. The selected upstream tool performs the computation.</text>

  <g filter="url(#shadow)">
    <rect x="32" y="112" width="202" height="208" rx="18" fill="#ffffff" stroke="#cfe2eb" stroke-width="2"/>
    <rect x="259" y="112" width="202" height="208" rx="18" fill="#ffffff" stroke="#cfe2eb" stroke-width="2"/>
    <rect x="486" y="112" width="202" height="208" rx="18" fill="#ffffff" stroke="#9ccfd5" stroke-width="2"/>
    <rect x="713" y="112" width="202" height="208" rx="18" fill="#fff9f6" stroke="#efb0a5" stroke-width="2"/>
    <rect x="940" y="112" width="202" height="208" rx="18" fill="#ffffff" stroke="#cfe2eb" stroke-width="2"/>
  </g>

  <rect x="32" y="112" width="202" height="7" rx="3.5" fill="#6a9ab0"/>
  <rect x="259" y="112" width="202" height="7" rx="3.5" fill="#23a8b9"/>
  <rect x="486" y="112" width="202" height="7" rx="3.5" fill="#23a8b9"/>
  <rect x="713" y="112" width="202" height="7" rx="3.5" fill="#e98b7c"/>
  <rect x="940" y="112" width="202" height="7" rx="3.5" fill="#6a9ab0"/>

  <text x="54" y="151" fill="#53798a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">01  DEFINE</text>
  <text x="54" y="187" fill="#123b63" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Task</text>
  <text x="54" y="224" fill="#39586a" font-family="Arial, Helvetica, sans-serif" font-size="16">Goal and evidence</text>
  <text x="54" y="251" fill="#39586a" font-family="Arial, Helvetica, sans-serif" font-size="16">Inputs and formats</text>
  <text x="54" y="278" fill="#39586a" font-family="Arial, Helvetica, sans-serif" font-size="16">Compute and limits</text>

  <text x="281" y="151" fill="#238291" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">02  ROUTE</text>
  <text x="281" y="187" fill="#123b63" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">SKILL.md</text>
  <text x="281" y="224" fill="#39586a" font-family="Arial, Helvetica, sans-serif" font-size="16">Match the task</text>
  <text x="281" y="251" fill="#39586a" font-family="Arial, Helvetica, sans-serif" font-size="16">Choose a category</text>
  <text x="281" y="278" fill="#39586a" font-family="Arial, Helvetica, sans-serif" font-size="16">Select a tool path</text>

  <text x="508" y="151" fill="#238291" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">03  INSPECT</text>
  <text x="508" y="184" fill="#123b63" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Tool knowledge</text>
  <text x="508" y="224" fill="#39586a" font-family="Arial, Helvetica, sans-serif" font-size="16">I/O and setup</text>
  <text x="508" y="251" fill="#39586a" font-family="Arial, Helvetica, sans-serif" font-size="16">Method and compute</text>
  <text x="508" y="278" fill="#39586a" font-family="Arial, Helvetica, sans-serif" font-size="16">Limits and terms</text>

  <text x="735" y="151" fill="#b85e51" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">04  CALL</text>
  <text x="735" y="184" fill="#123b63" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Upstream tool</text>
  <text x="735" y="224" fill="#39586a" font-family="Arial, Helvetica, sans-serif" font-size="16">Local package</text>
  <text x="735" y="251" fill="#39586a" font-family="Arial, Helvetica, sans-serif" font-size="16">or external service</text>
  <text x="735" y="278" fill="#39586a" font-family="Arial, Helvetica, sans-serif" font-size="16">Produce an artifact</text>

  <text x="962" y="151" fill="#53798a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">05  CHECK</text>
  <text x="962" y="184" fill="#123b63" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Validate or chain</text>
  <text x="962" y="224" fill="#39586a" font-family="Arial, Helvetica, sans-serif" font-size="16">Check the output</text>
  <text x="962" y="251" fill="#39586a" font-family="Arial, Helvetica, sans-serif" font-size="16">Check next interface</text>
  <text x="962" y="278" fill="#39586a" font-family="Arial, Helvetica, sans-serif" font-size="16">Re-score changes</text>

  <path d="M239 216 H252" stroke="#6a9ab0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M466 216 H479" stroke="#6a9ab0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M693 216 H706" stroke="#6a9ab0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M920 216 H933" stroke="#6a9ab0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="32" y="391" width="1110" height="94" rx="16" fill="#dfeff3" stroke="#c9e2e8" stroke-width="2"/>
  <text x="55" y="423" fill="#123b63" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.25">KNOWLEDGE THAT TRAVELS WITH EACH HANDOFF</text>
  <text x="55" y="458" fill="#284f62" font-family="Arial, Helvetica, sans-serif" font-size="18">Tool fit</text>
  <circle cx="166" cy="452" r="3.5" fill="#23a8b9"/>
  <text x="187" y="458" fill="#284f62" font-family="Arial, Helvetica, sans-serif" font-size="18">Documented I/O</text>
  <circle cx="328" cy="452" r="3.5" fill="#23a8b9"/>
  <text x="349" y="458" fill="#284f62" font-family="Arial, Helvetica, sans-serif" font-size="18">Environment and versions</text>
  <circle cx="595" cy="452" r="3.5" fill="#23a8b9"/>
  <text x="616" y="458" fill="#284f62" font-family="Arial, Helvetica, sans-serif" font-size="18">Score meaning</text>
  <circle cx="745" cy="452" r="3.5" fill="#23a8b9"/>
  <text x="766" y="458" fill="#284f62" font-family="Arial, Helvetica, sans-serif" font-size="18">Validation</text>
  <circle cx="875" cy="452" r="3.5" fill="#23a8b9"/>
  <text x="896" y="458" fill="#284f62" font-family="Arial, Helvetica, sans-serif" font-size="18">Artifact terms</text>
</svg>
